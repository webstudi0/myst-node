apiVersion: apps/v1
kind: Deployment
metadata:
  name: myst-node
  labels:
    app: myst-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myst-node
  template:
    metadata:
      labels:
        app: myst-node
    spec:
      containers:
        - name: myst
          image: mysteriumnetwork/myst:latest
          args:
            - service
            - --agreed-terms-and-conditions
          ports:
            - containerPort: 4050
              name: api
              protocol: TCP
            - containerPort: 4449
              name: ui
              protocol: TCP
            - containerPort: 1194
              name: openvpn
              protocol: UDP
            - containerPort: 51820
              name: wireguard
              protocol: UDP
          env:
            - name: MYST_DATA_DIR
              value: /var/lib/mysterium-node
            - name: MYST_API_PORT
              value: "4050"
            - name: MYST_OPENVPN_PORT
              value: "1194"
            - name: MYST_WIREGUARD_PORT
              value: "51820"
            # Optional: Set node identity and other settings
            # - name: MYST_NODE_IDENTITY
            #   value: "0xYourEthereumAddress"
            - name: MYST_NODE_IDENTITY
              valueFrom:
                secretKeyRef:
                  name: myst-identity
                  key: MYST_NODE_IDENTITY
          volumeMounts:
            - name: myst-data
              mountPath: /var/lib/mysterium-node
            - name: dev-tun
              mountPath: /dev/net/tun
          securityContext:
            capabilities:
              add:
                - NET_ADMIN      # Required for TUN interface creation
                - SYS_MODULE     # Sometimes needed for loading kernel modules
            privileged: false
      volumes:
        - name: myst-data
          hostPath:
            path: /opt/data/myst-node   # Adjust to your host path
            type: DirectoryOrCreate
        - name: dev-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
