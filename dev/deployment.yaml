apiVersion: apps/v1
kind: Deployment
metadata:
  name: myst-node
  labels:
    app: myst-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myst-node
  template:
    metadata:
      labels:
        app: myst-node
    spec:
      containers:
        - name: myst
          image: mysteriumnetwork/myst:latest
          args:
            - "--data-dir=/var/lib/mysterium"
            - "--api.address=:4050"
            - "--openvpn.port=1194"
            - "--wireguard.port=51820"
          ports:
            - containerPort: 4050
              name: api
              protocol: TCP
            - containerPort: 1194
              name: openvpn
              protocol: UDP
            - containerPort: 51820
              name: wireguard
              protocol: UDP
          env:
            - name: MYST_DATA_DIR
              value: /var/lib/mysterium
          volumeMounts:
            - name: myst-data
              mountPath: /var/lib/mysterium
            - name: dev-tun
              mountPath: /dev/net/tun
          securityContext:
            capabilities:
              add:
                - NET_ADMIN      # Required for TUN interface creation
                - SYS_MODULE     # Sometimes needed for loading kernel modules
            privileged: false   # Using specific caps is preferred over full privileged
      volumes:
        - name: myst-data
          # For production, use a PersistentVolumeClaim instead of hostPath
          hostPath:
            path: /opt/data/myst-node   # Adjust to your host path
            type: DirectoryOrCreate
        - name: dev-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
