apiVersion: v1
kind: Service
metadata:
  name: myst-node-service
  labels:
    app: myst-node
spec:
  type: NodePort
  selector:
    app: myst-node
  ports:
    - name: api
      port: 4050
      targetPort: 4050
      protocol: TCP
      nodePort: 30405        # Optional, if not set Kubernetes will assign a port
    - name: ui
      port: 4449
      targetPort: 4449
      protocol: TCP
    - name: openvpn
      port: 1194
      targetPort: 1194
      protocol: UDP
      nodePort: 30194
    - name: wireguard
      port: 51820
      targetPort: 51820
      
