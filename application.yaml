apiVersion: argoproj.io/v1beta1
kind: Application
metadata:
  name: myst-node
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/webstudi0/myst-node.git
    targetRevision: HEAD
    path: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: myst-node
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
